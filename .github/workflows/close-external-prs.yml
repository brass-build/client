# This repo is a read-only publish mirror: changes are synced from a
# private monorepo, so a PR opened here cannot be merged (the next sync
# would overwrite it). Close incoming PRs with a pointer to where the work
# actually happens. Issues are disabled in repo settings; PRs cannot be
# disabled, so this handles them.
name: Close external PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body \
            "Thanks for the interest. This repository is a read-only publish mirror, so pull requests here can't be merged. It's rebuilt from a private source repository on every release. To report a bug or request a change, reach us at https://brass.build."
          gh pr close "$PR" --repo "$REPO"
